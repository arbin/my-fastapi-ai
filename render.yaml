services:
  - type: web
    name: fastapi-summarizer
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # You’ll set it in the dashboard (not stored in Git)
